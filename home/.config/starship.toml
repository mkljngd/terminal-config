"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_1)\
$os\
$username\
[](bg:color_2 fg:color_1)\
$directory\
[](fg:color_2 bg:color_3)\
$git_branch\
$git_status\
[](fg:color_3 bg:color_4)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
[ ](fg:color_4)\
$fill\
[ ](fg:color_5)\
$cmd_duration\
$memory_usage\
[](fg:color_5 bg:color_6)\
$time\
[](fg:color_6)\
$line_break$character"""

palette = 'cyan_shades'

# Shown on extra lines of a multi-line command (Shift+Enter).
continuation_prompt = '[❯❯](bold fg:color_3) '

# Matches the WezTerm theme: shades and tints of its cyan foreground (#0abdc6),
# darkest on the left to lightest on the right. text_N is the text color on
# block color_N.
[palettes.cyan_shades]
color_1 = '#022628'   # OS / user: darkest, so the Iron Man icon stands out
text_1 = '#0abdc6'
color_2 = '#044c4f'   # directory
text_2 = '#ffffff'
color_3 = '#067b81'   # git
text_3 = '#ffffff'
color_4 = '#0abdc6'   # languages: theme foreground cyan
text_4 = '#000000'
color_5 = '#60d4da'   # docker / conda
text_5 = '#000000'
color_6 = '#a9e8eb'   # duration + time: lightest tint
text_6 = '#000000'
color_7 = '#db2777'   # prompt symbol after an error
color_8 = '#0abdc6'   # prompt symbol after success: theme cyan
color_9 = '#fde047'   # vi command mode



# ────────────────────────────────
# OS / USER
# ────────────────────────────────
[os]
disabled = false
style = "bg:color_1 fg:text_1"

[os.symbols]
Windows = "󰍲"
Ubuntu = "\uE900"       # Iron Man (Custom Prompt Icons font, WezTerm only)
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_1 fg:text_1"
style_root = "bg:color_1 fg:text_1"
format = '[ $user ]($style)'

# ────────────────────────────────
# DIRECTORY
# ────────────────────────────────
[directory]
style = "fg:text_2 bg:color_2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ────────────────────────────────
# GIT
# ────────────────────────────────
[git_branch]
symbol = ""
style = "bg:color_3"
format = '[[ $symbol $branch ](fg:text_3 bg:color_3)]($style)'

[git_status]
style = "bg:color_3"
format = '[[($all_status$ahead_behind )](fg:text_3 bg:color_3)]($style)'

# ────────────────────────────────
# LANGUAGES (C, C++, JS, RUST, etc.)
# ────────────────────────────────
[c]
symbol = " "
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[rust]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[golang]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[nodejs]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[php]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[java]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[kotlin]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[haskell]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

[python]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $version) ](fg:text_4 bg:color_4)]($style)'

# ────────────────────────────────
# DOCKER / ENVIRONMENT
# ────────────────────────────────
[docker_context]
symbol = ""
style = "bg:color_4"
format = '[[ $symbol( $context) ](fg:text_4 bg:color_4)]($style)'

[conda]
style = "bg:color_4"
format = '[[ $symbol( $environment) ](fg:text_4 bg:color_4)]($style)'

# RAM % used, always shown. Inside WSL this is the WSL VM, not all of Windows.
[memory_usage]
disabled = false
threshold = -1
style = "bg:color_5"
format = '[[ 󰍛 $ram_pct ](fg:text_5 bg:color_5)]($style)'

# ────────────────────────────────
# FILL: thin line between the left segments and the right-aligned info
# ────────────────────────────────
[fill]
symbol = "─"
style = "fg:color_2"

# ────────────────────────────────
# TIME
# ────────────────────────────────
[time]
disabled = false
time_format = "%R"
style = "bg:color_6"
format = '[[  $time ](fg:text_6 bg:color_6)]($style)'

# Time taken by the last command (2s+), right side next to RAM.
[cmd_duration]
min_time = 2000
style = "bg:color_5"
format = '[[ 󱦟 $duration ](fg:text_5 bg:color_5)]($style)'

# ────────────────────────────────
# CHARACTER / PROMPT END
# ────────────────────────────────
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[  ](bold fg:color_8)'             # futuristic check/arrow
error_symbol = '[  ](bold fg:color_7)'               # bold angular X
vimcmd_symbol = '[ 󰌌 ](bold fg:color_9)'             # terminal cursor
vimcmd_replace_one_symbol = '[󰞷](bold fg:color_6)' # circular tech arrow
vimcmd_replace_symbol = '[󰞸](bold fg:color_6)'     # double tech arrow
vimcmd_visual_symbol = '[󰌖](bold fg:color_3)'      # swap icon, selection mode
